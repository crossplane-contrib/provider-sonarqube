apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: example-slack-integration-credentials
type: Opaque
stringData:
  clientSecret: example
  signingSecret: example
---
apiVersion: integration.sonarqube.crossplane.io/v1alpha1
kind: SlackIntegration
metadata:
  namespace: default
  name: example-slack-integration
spec:
  forProvider:
    clientId: "1234567890.1234567890123"
    clientSecretRef:
      name: example-slack-integration-credentials
      key: clientSecret
    signingSecretRef:
      name: example-slack-integration-credentials
      key: signingSecret
  providerConfigRef:
    name: example
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: example-slack-integration-connection
