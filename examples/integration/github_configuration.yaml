apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: example-githubconfiguration-client-secret
type: Opaque
stringData:
  clientSecret: example-client-secret

---
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: example-githubconfiguration-private-key
type: Opaque
stringData:
  privateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    ...
    -----END RSA PRIVATE KEY-----

---
# GitHub authentication and provisioning of the SonarQube instance
# (Administration > Authentication > GitHub). SonarQube supports a single
# GitHub configuration per instance: an existing one is adopted.
apiVersion: integration.sonarqube.crossplane.io/v1alpha1
kind: GitHubConfiguration
metadata:
  namespace: default
  name: example-githubconfiguration
spec:
  forProvider:
    enabled: true
    applicationId: "123456"
    clientId: "Iv1.abc123"
    clientSecretRef:
      name: example-githubconfiguration-client-secret
      key: clientSecret
    privateKeyRef:
      name: example-githubconfiguration-private-key
      key: privateKey
    apiUrl: https://api.github.com/
    webUrl: https://github.com/
    allowedOrganizations:
      - my-organization
    provisioningType: JIT
    synchronizeGroups: true
    allowUsersToSignUp: true
  providerConfigRef:
    name: example
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: example-githubconfiguration-connection
