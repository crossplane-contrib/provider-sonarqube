apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: example-gitlab-configuration-credentials
type: Opaque
stringData:
  applicationSecret: example
  provisioningToken: example
---
apiVersion: integration.sonarqube.crossplane.io/v1alpha1
kind: GitLabConfiguration
metadata:
  namespace: default
  name: example-gitlab-configuration
spec:
  forProvider:
    enabled: true
    applicationId: example-application-id
    url: https://gitlab.example.com
    applicationSecretRef:
      name: example-gitlab-configuration-credentials
      key: applicationSecret
    synchronizeGroups: true
    allowedGroups:
      - my-group
    provisioningType: AUTO_PROVISIONING
    provisioningTokenSecretRef:
      name: example-gitlab-configuration-credentials
      key: provisioningToken
    allowUsersToSignUp: false
  providerConfigRef:
    name: example
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: example-gitlab-configuration-connection
