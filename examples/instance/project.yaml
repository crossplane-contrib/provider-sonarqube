---
apiVersion: instance.sonarqube.crossplane.io/v1alpha1
kind: Project
metadata:
  name: example-project
  namespace: default
spec:
  forProvider:
    # Key of the project in SonarQube, must be unique across the server
    key: example-project-key
    # Display name of the project in SonarQube
    name: Example Project
    # Description of the project in SonarQube
    description: This is an example project managed by Crossplane
    # Visibility of the project, either public or private
    visibility: public
    # Tags to associate with the project in SonarQube
    tags:
      - crossplane
      - example
    # Default branch for the project in SonarQube
    defaultBranch: main
    # New code definition for the project in SonarQube
    newCodePeriod:
      # Type of the new code definition, either previous_version or reference_branch
      type: NUMBER_OF_DAYS
      # Value of the new code definition, required if type is reference_branch
      value: "90"
    # Links to display in the project overview in SonarQube
    links:
      - name: GitHub Repository
        url: https://github.com/crossplane-contrib/provider-sonarqube
    # Quality gate to apply to the project in SonarQube
    qualityGateNameRef:
      name: example-qualitygate
    # Quality profiles to apply to the project in SonarQube, keyed by language
    qualityProfiles:
      go:
        idRef:
          name: example-qualityprofile-go

  providerConfigRef:
    name: example
    kind: ProviderConfig
