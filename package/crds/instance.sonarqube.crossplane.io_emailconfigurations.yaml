---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: emailconfigurations.instance.sonarqube.crossplane.io
spec:
  group: instance.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: EmailConfiguration
    listKind: EmailConfigurationList
    plural: emailconfigurations
    singular: emailconfiguration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An EmailConfiguration manages the email (SMTP) configuration of a
          SonarQube instance (Administration > Configuration > General Settings >
          Email), through the api/v2/system/email-configurations endpoints.

          SonarQube supports a single email configuration per instance. The external
          name is the configuration ID assigned by SonarQube. To manage a
          configuration that already exists, set the crossplane.io/external-name
          annotation to its ID.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              An EmailConfigurationSpec defines the desired state of an
              EmailConfiguration.

              writeConnectionSecretToRef is required: SonarQube never returns the SMTP
              password nor the OAuth client ID and secret, so the provider stores the
              values it last applied there to detect their rotation.
            properties:
              forProvider:
                description: |-
                  EmailConfigurationParameters are the configurable fields of an
                  EmailConfiguration.
                properties:
                  authMethod:
                    description: |-
                      AuthMethod is how SonarQube authenticates to the SMTP server: BASIC
                      (username and password) or OAUTH (Microsoft Exchange only).
                    enum:
                    - BASIC
                    - OAUTH
                    type: string
                  basicPasswordSecretRef:
                    description: |-
                      BasicPasswordSecretRef references the Secret key holding the SMTP
                      password. The Secret is read from the EmailConfiguration's namespace.
                      Required when AuthMethod is BASIC, ignored otherwise.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  fromAddress:
                    description: FromAddress is the address emails are sent from.
                    minLength: 1
                    type: string
                  fromName:
                    description: FromName is the name emails are sent from, usually
                      SonarQube.
                    minLength: 1
                    type: string
                  host:
                    description: Host is the host of the SMTP server.
                    minLength: 1
                    type: string
                  oauthAuthenticationHost:
                    description: |-
                      OAuthAuthenticationHost is the host of the identity provider issuing
                      access tokens, for example https://login.microsoftonline.com.
                      Required when AuthMethod is OAUTH, ignored otherwise.
                    minLength: 1
                    type: string
                  oauthClientIdSecretRef:
                    description: |-
                      OAuthClientIDSecretRef references the Secret key holding the OAuth
                      client ID. The Secret is read from the EmailConfiguration's namespace.
                      Required when AuthMethod is OAUTH, ignored otherwise.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  oauthClientSecretSecretRef:
                    description: |-
                      OAuthClientSecretSecretRef references the Secret key holding the OAuth
                      client secret. The Secret is read from the EmailConfiguration's
                      namespace.
                      Required when AuthMethod is OAUTH, ignored otherwise.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  oauthScope:
                    description: |-
                      OAuthScope is the scope of the OAuth token request, used when
                      AuthMethod is OAUTH. SonarQube defaults it to
                      https://outlook.office365.com/.default. Requires SonarQube 2026.5 or
                      later.
                      Late-initialized from SonarQube if unset.
                    minLength: 1
                    type: string
                  oauthTenant:
                    description: |-
                      OAuthTenant is the Microsoft tenant.
                      Required when AuthMethod is OAUTH, ignored otherwise.
                    minLength: 1
                    type: string
                  port:
                    description: Port is the port of the SMTP server, usually 25,
                      465 or 587.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  securityProtocol:
                    description: |-
                      SecurityProtocol is the protocol used to secure the connection to the
                      SMTP server: NONE, SSLTLS or STARTTLS.
                    enum:
                    - NONE
                    - SSLTLS
                    - STARTTLS
                    type: string
                  subjectPrefix:
                    description: |-
                      SubjectPrefix is the prefix added to email subjects, usually
                      [SonarQube].
                    minLength: 1
                    type: string
                  username:
                    description: |-
                      Username is the user authenticating to the SMTP server, with both
                      authentication methods.
                    minLength: 1
                    type: string
                required:
                - authMethod
                - fromAddress
                - fromName
                - host
                - port
                - securityProtocol
                - subjectPrefix
                - username
                type: object
                x-kubernetes-validations:
                - message: basicPasswordSecretRef is required when authMethod is BASIC
                  rule: self.authMethod != 'BASIC' || has(self.basicPasswordSecretRef)
                - message: oauthAuthenticationHost is required when authMethod is
                    OAUTH
                  rule: self.authMethod != 'OAUTH' || has(self.oauthAuthenticationHost)
                - message: oauthTenant is required when authMethod is OAUTH
                  rule: self.authMethod != 'OAUTH' || has(self.oauthTenant)
                - message: oauthClientIdSecretRef is required when authMethod is OAUTH
                  rule: self.authMethod != 'OAUTH' || has(self.oauthClientIdSecretRef)
                - message: oauthClientSecretSecretRef is required when authMethod
                    is OAUTH
                  rule: self.authMethod != 'OAUTH' || has(self.oauthClientSecretSecretRef)
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: writeConnectionSecretToRef with a non-empty name is required
              rule: has(self.writeConnectionSecretToRef) && size(self.writeConnectionSecretToRef.name)
                > 0
          status:
            description: |-
              An EmailConfigurationStatus represents the observed state of an
              EmailConfiguration.
            properties:
              atProvider:
                description: |-
                  EmailConfigurationObservation are the observable fields of an
                  EmailConfiguration.
                properties:
                  authMethod:
                    description: AuthMethod is the authentication method.
                    type: string
                  fromAddress:
                    description: FromAddress is the address emails are sent from.
                    type: string
                  fromName:
                    description: FromName is the name emails are sent from.
                    type: string
                  host:
                    description: Host is the host of the SMTP server.
                    type: string
                  id:
                    description: |-
                      ID is the identifier of the configuration in SonarQube, used as the
                      external name.
                    type: string
                  isBasicPasswordSet:
                    description: IsBasicPasswordSet reports whether SonarQube holds
                      an SMTP password.
                    type: boolean
                  isOauthClientIdSet:
                    description: IsOAuthClientIDSet reports whether SonarQube holds
                      an OAuth client ID.
                    type: boolean
                  isOauthClientSecretSet:
                    description: |-
                      IsOAuthClientSecretSet reports whether SonarQube holds an OAuth client
                      secret.
                    type: boolean
                  oauthAuthenticationHost:
                    description: OAuthAuthenticationHost is the host of the identity
                      provider.
                    type: string
                  oauthScope:
                    description: OAuthScope is the scope of the OAuth token request.
                    type: string
                  oauthTenant:
                    description: OAuthTenant is the Microsoft tenant.
                    type: string
                  port:
                    description: Port is the port of the SMTP server.
                    type: string
                  securityProtocol:
                    description: SecurityProtocol is the protocol securing the SMTP
                      connection.
                    type: string
                  subjectPrefix:
                    description: SubjectPrefix is the prefix added to email subjects.
                    type: string
                  username:
                    description: Username is the user authenticating to the SMTP server.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
