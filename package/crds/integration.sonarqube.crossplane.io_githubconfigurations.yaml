---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: githubconfigurations.integration.sonarqube.crossplane.io
spec:
  group: integration.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: GitHubConfiguration
    listKind: GitHubConfigurationList
    plural: githubconfigurations
    singular: githubconfiguration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A GitHubConfiguration is a managed resource that represents the GitHub
          authentication and provisioning configuration of a SonarQube instance
          (Administration > Authentication > GitHub). It differs from ALMGitHub,
          which configures a GitHub DevOps Platform integration used to import and
          analyze repositories.

          SonarQube supports a single GitHub configuration per instance. A
          GitHubConfiguration without an external name adopts the existing
          configuration, if there is one, and deleting the GitHubConfiguration
          deletes it, unless the deletion policy is Orphan.

          spec.writeConnectionSecretToRef is required: SonarQube does not return
          the client ID, client secret and private key, so the provider saves the
          values it last applied there to detect changes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              A GitHubConfigurationSpec defines the desired state of a
              GitHubConfiguration.
            properties:
              forProvider:
                description: |-
                  GitHubConfigurationParameters are the configurable fields of a
                  GitHubConfiguration.
                properties:
                  allowUsersToSignUp:
                    description: |-
                      AllowUsersToSignUp lets users who do not have a SonarQube account yet
                      sign up through GitHub. Only applies to JIT provisioning.
                      Late-initialized from SonarQube when unset.
                    type: boolean
                  allowedOrganizations:
                    description: |-
                      AllowedOrganizations restricts authentication (and provisioning) to
                      the members of these GitHub organizations. When empty, users of every
                      organization the GitHub App is installed in can log in.
                      Late-initialized from SonarQube when unset.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  apiUrl:
                    description: |-
                      APIURL is the API URL of the GitHub instance, for example
                      https://api.github.com/ for github.com, or
                      https://github.company.com/api/v3/ for GitHub Enterprise.
                    format: uri
                    minLength: 1
                    type: string
                  applicationId:
                    description: |-
                      ApplicationID is the ID of the GitHub App, found on the GitHub App's
                      page under Settings > Developer Settings > GitHub Apps.
                    minLength: 1
                    type: string
                  clientId:
                    description: |-
                      ClientID is the client ID of the GitHub App.
                      SonarQube does not return it, so the provider compares it with the
                      value it last applied, saved to writeConnectionSecretToRef.
                    minLength: 1
                    type: string
                  clientSecretRef:
                    description: |-
                      ClientSecretRef references a Secret containing the client secret of
                      the GitHub App.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  enabled:
                    default: true
                    description: Enabled enables GitHub authentication. Defaults to
                      true.
                    type: boolean
                  privateKeyRef:
                    description: |-
                      PrivateKeyRef references a Secret containing the private key of the
                      GitHub App, the whole content of its .pem file.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  projectVisibility:
                    description: |-
                      ProjectVisibility synchronizes the visibility of provisioned projects
                      with the visibility of their GitHub repository. When false, every
                      provisioned project is private. Only applies to AUTO_PROVISIONING.
                      Late-initialized from SonarQube when unset.
                    type: boolean
                  provisioningType:
                    default: JIT
                    description: |-
                      ProvisioningType is how users and groups are provisioned: JIT (just
                      in time, when users log in) or AUTO_PROVISIONING (users, groups and
                      permissions synchronized from GitHub). Defaults to JIT.
                    enum:
                    - JIT
                    - AUTO_PROVISIONING
                    type: string
                  synchronizeGroups:
                    description: |-
                      SynchronizeGroups synchronizes GitHub team memberships with the
                      SonarQube groups of the same name when users log in.
                      Late-initialized from SonarQube when unset.
                    type: boolean
                  userConsentRequiredAfterUpgrade:
                    description: |-
                      UserConsentRequiredAfterUpgrade reports whether an administrator must
                      consent again to the synchronization of permissions from GitHub,
                      which SonarQube requires after some upgrades. Setting it to false
                      gives that consent. Late-initialized from SonarQube when unset.
                    type: boolean
                  webUrl:
                    description: |-
                      WebURL is the web URL of the GitHub instance, for example
                      https://github.com/ for github.com, or https://github.company.com/
                      for GitHub Enterprise.
                    format: uri
                    minLength: 1
                    type: string
                required:
                - apiUrl
                - applicationId
                - clientId
                - clientSecretRef
                - privateKeyRef
                - webUrl
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: writeConnectionSecretToRef with a non-empty name is required
              rule: has(self.writeConnectionSecretToRef) && size(self.writeConnectionSecretToRef.name)
                > 0
          status:
            description: |-
              A GitHubConfigurationStatus represents the observed state of a
              GitHubConfiguration.
            properties:
              atProvider:
                description: |-
                  GitHubConfigurationObservation are the observable fields of a
                  GitHubConfiguration.
                properties:
                  allowUsersToSignUp:
                    description: |-
                      AllowUsersToSignUp reports whether new users may sign up through
                      GitHub.
                    type: boolean
                  allowedOrganizations:
                    description: |-
                      AllowedOrganizations are the GitHub organizations allowed to
                      authenticate.
                    items:
                      type: string
                    type: array
                  apiUrl:
                    description: APIURL is the API URL of the GitHub instance.
                    type: string
                  applicationId:
                    description: ApplicationID is the ID of the GitHub App.
                    type: string
                  enabled:
                    description: Enabled reports whether GitHub authentication is
                      enabled.
                    type: boolean
                  errorMessage:
                    description: |-
                      ErrorMessage is the error SonarQube reports for an incorrect
                      configuration, if any.
                    type: string
                  id:
                    description: ID is the identifier of the GitHub configuration
                      in SonarQube.
                    type: string
                  projectVisibility:
                    description: |-
                      ProjectVisibility reports whether project visibility is synchronized
                      with GitHub.
                    type: boolean
                  provisioningType:
                    description: ProvisioningType is the provisioning type.
                    type: string
                  synchronizeGroups:
                    description: |-
                      SynchronizeGroups reports whether GitHub teams are synchronized with
                      SonarQube groups.
                    type: boolean
                  userConsentRequiredAfterUpgrade:
                    description: |-
                      UserConsentRequiredAfterUpgrade reports whether an administrator must
                      consent again to the synchronization of permissions from GitHub.
                    type: boolean
                  webUrl:
                    description: WebURL is the web URL of the GitHub instance.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
