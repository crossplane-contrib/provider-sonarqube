metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: aicodefixconfigurations.integration.sonarqube.crossplane.io
spec:
  group: integration.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: AICodeFixConfiguration
    listKind: AICodeFixConfigurationList
    plural: aicodefixconfigurations
    singular: aicodefixconfiguration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.enablement
      name: ENABLEMENT
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An AICodeFixConfiguration manages the instance-wide AI CodeFix enablement
          of a SonarQube instance: whether AI CodeFix is disabled, enabled for every
          project, or enabled for selected projects only. The LLM it uses is
          configured with an LLMProvider mapped to the AI_CODEFIX capability.

          It is a singleton: manage at most one AICodeFixConfiguration per SonarQube
          instance. Deleting it disables AI CodeFix. Requires SonarQube Enterprise
          Edition or above; the underlying API is marked internal by SonarQube.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              An AICodeFixConfigurationSpec defines the desired state of an
              AICodeFixConfiguration.
            properties:
              forProvider:
                description: |-
                  AICodeFixConfigurationParameters are the configurable fields of an
                  AICodeFixConfiguration.
                properties:
                  enabledProjectKeyRefs:
                    description: |-
                      EnabledProjectKeyRefs are references to Projects used to populate
                      EnabledProjectKeys.
                    items:
                      description: A Reference to a named object.
                      properties:
                        name:
                          description: Name of the referenced object.
                          type: string
                        policy:
                          description: Policies for referencing.
                          properties:
                            resolution:
                              default: Required
                              description: |-
                                Resolution specifies whether resolution of this reference is required.
                                The default is 'Required', which means the reconcile will fail if the
                                reference cannot be resolved. 'Optional' means this reference will be
                                a no-op if it cannot be resolved.
                              enum:
                              - Required
                              - Optional
                              type: string
                            resolve:
                              description: |-
                                Resolve specifies when this reference should be resolved. The default
                                is 'IfNotPresent', which will attempt to resolve the reference only when
                                the corresponding field is not present. Use 'Always' to resolve the
                                reference on every reconcile.
                              enum:
                              - Always
                              - IfNotPresent
                              type: string
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  enabledProjectKeySelector:
                    description: |-
                      EnabledProjectKeySelector selects references to Projects used to
                      populate EnabledProjectKeys.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  enabledProjectKeys:
                    description: |-
                      EnabledProjectKeys is the exhaustive list of keys of the projects AI
                      CodeFix is enabled for. Only allowed when Enablement is
                      ENABLED_FOR_SOME_PROJECTS.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  enablement:
                    description: Enablement is the AI CodeFix enablement scope.
                    enum:
                    - DISABLED
                    - ENABLED_FOR_ALL_PROJECTS
                    - ENABLED_FOR_SOME_PROJECTS
                    type: string
                required:
                - enablement
                type: object
                x-kubernetes-validations:
                - message: enabledProjectKeys, enabledProjectKeyRefs and enabledProjectKeySelector
                    are only allowed when enablement is ENABLED_FOR_SOME_PROJECTS
                  rule: self.enablement == 'ENABLED_FOR_SOME_PROJECTS' || ((!has(self.enabledProjectKeys)
                    || size(self.enabledProjectKeys) == 0) && (!has(self.enabledProjectKeyRefs)
                    || size(self.enabledProjectKeyRefs) == 0) && !has(self.enabledProjectKeySelector))
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: |-
              An AICodeFixConfigurationStatus represents the observed state of an
              AICodeFixConfiguration.
            properties:
              atProvider:
                description: |-
                  AICodeFixConfigurationObservation are the observable fields of an
                  AICodeFixConfiguration.
                properties:
                  enabledProjectKeys:
                    description: |-
                      EnabledProjectKeys are the keys of the projects AI CodeFix is enabled
                      for, when Enablement is ENABLED_FOR_SOME_PROJECTS.
                    items:
                      type: string
                    type: array
                  enablement:
                    description: Enablement is the observed AI CodeFix enablement
                      scope.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
