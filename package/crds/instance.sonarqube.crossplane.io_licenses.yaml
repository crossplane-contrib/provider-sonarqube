---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: licenses.instance.sonarqube.crossplane.io
spec:
  group: instance.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: License
    listKind: LicenseList
    plural: licenses
    singular: license
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A License manages a SonarQube instance license.

          WARNING: spec.writeConnectionSecretToRef is required. Without it the
          provider cannot remember the license key it last applied, so it will
          re-apply (and, if spec.forProvider.endpoint is configured, re-fetch) the
          license on every reconcile even when nothing has changed -- a permanent
          reconcile loop.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              A LicenseSpec defines the desired state of a License.

              writeConnectionSecretToRef is required: without it the provider has no
              record of the license key it last applied, so it cannot tell whether the
              SonarQube instance is still in sync and will re-apply (and, if Endpoint is
              configured, re-fetch) the license on every reconcile even when nothing
              has actually changed -- a permanent reconcile loop.
            properties:
              forProvider:
                description: |-
                  LicenseParameters are the configurable fields of a License.

                  Exactly one of LicenseKeySecretRef or Endpoint must be set.
                properties:
                  endpoint:
                    description: |-
                      Endpoint fetches the license key from an HTTP(S) endpoint instead of a
                      static secret, optionally using authentication. Useful when a vendor
                      license portal exposes a stable URL that always serves the current
                      license, e.g. to automatically pick up renewals.
                      Exactly one of LicenseKeySecretRef or Endpoint must be set.
                    properties:
                      basicAuthPasswordSecretRef:
                        description: |-
                          BasicAuthPasswordSecretRef references the secret key holding the
                          password sent using HTTP Basic authentication.
                          Requires BasicAuthUsername to also be set.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      basicAuthUsername:
                        description: |-
                          BasicAuthUsername is the username sent using HTTP Basic authentication.
                          Requires BasicAuthPasswordSecretRef to also be set. Mutually exclusive
                          with BearerTokenSecretRef.
                        type: string
                      bearerTokenSecretRef:
                        description: |-
                          BearerTokenSecretRef references the secret key holding a bearer token
                          sent in the endpoint request's Authorization header. Mutually
                          exclusive with BasicAuthUsername.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      url:
                        description: |-
                          URL is the HTTP(S) endpoint the license key is fetched from. The
                          response body, trimmed of surrounding whitespace, is used verbatim as
                          the license key.
                        type: string
                    required:
                    - url
                    type: object
                    x-kubernetes-validations:
                    - message: basicAuthPasswordSecretRef is required when basicAuthUsername
                        is set
                      rule: '!has(self.basicAuthUsername) || has(self.basicAuthPasswordSecretRef)'
                    - message: basicAuthUsername is required when basicAuthPasswordSecretRef
                        is set
                      rule: '!has(self.basicAuthPasswordSecretRef) || has(self.basicAuthUsername)'
                    - message: basicAuthUsername and bearerTokenSecretRef are mutually
                        exclusive
                      rule: '!(has(self.basicAuthUsername) && has(self.bearerTokenSecretRef))'
                  licenseKeySecretRef:
                    description: |-
                      LicenseKeySecretRef references the secret key holding the license key
                      to apply directly to the SonarQube instance.
                      Exactly one of LicenseKeySecretRef or Endpoint must be set.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of licenseKeySecretRef or endpoint must be
                    set
                  rule: has(self.licenseKeySecretRef) != has(self.endpoint)
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: writeConnectionSecretToRef with a non-empty name is required
              rule: has(self.writeConnectionSecretToRef) && size(self.writeConnectionSecretToRef.name)
                > 0
          status:
            description: A LicenseStatus represents the observed state of a License.
            properties:
              atProvider:
                description: LicenseObservation are the observable fields of a License.
                properties:
                  contactEmail:
                    type: string
                  expiresAt:
                    type: string
                  isExpired:
                    type: boolean
                  isOfficialDistribution:
                    type: boolean
                  isSupported:
                    type: boolean
                  isValidEdition:
                    type: boolean
                  isValidServerId:
                    type: boolean
                  locsMax:
                    format: int64
                    type: integer
                  locsRemaining:
                    format: int64
                    type: integer
                  organization:
                    type: string
                  productEdition:
                    type: string
                  serverId:
                    type: string
                  type:
                    type: string
                required:
                - contactEmail
                - expiresAt
                - isExpired
                - isOfficialDistribution
                - isSupported
                - isValidEdition
                - isValidServerId
                - locsMax
                - locsRemaining
                - organization
                - productEdition
                - serverId
                - type
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
