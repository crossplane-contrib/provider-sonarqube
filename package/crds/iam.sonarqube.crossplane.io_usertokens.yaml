      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A UserToken manages a SonarQube user access token.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A UserTokenSpec defines the desired state of a UserToken.
            properties:
              forProvider:
                description: |-
                  UserTokenParameters are the configurable fields of a UserToken.

                  Exactly one of ExpirationDate or RenewalPeriodDays may be set.
                  If neither is set the token never expires.
                properties:
                  expirationDate:
                    description: |-
                      ExpirationDate is an explicit token expiration date in YYYY-MM-DD format.
                      Mutually exclusive with RenewalPeriodDays.
                      If neither ExpirationDate nor RenewalPeriodDays is set, the token never expires.
                    type: string
                  login:
                    description: |-
                      Login is the user login the token belongs to.
                      WARNING: This field is immutable once set.
                    type: string
                    x-kubernetes-validations:
                    - message: Login is immutable.
                      rule: self == oldSelf
                  loginRef:
                    description: LoginRef references a User to populate the login
                      field.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  loginSelector:
                    description: LoginSelector selects a User to populate the login
                      field.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  name:
                    description: |-
                      Name is the token name. Immutable after creation. Used as external name.
                      WARNING: This field is immutable once set.
                    type: string
                    x-kubernetes-validations:
                    - message: Name is immutable.
                      rule: self == oldSelf
                  projectKey:
                    description: |-
                      ProjectKey is the key of the project this token grants analysis access to.
                      Required when Type is PROJECT_ANALYSIS_TOKEN. Immutable after creation.
                      WARNING: This field is immutable once set.
                    type: string
                    x-kubernetes-validations:
                    - message: ProjectKey is immutable.
                      rule: self == oldSelf
                  renewBeforeDays:
                    description: |-
                      RenewBeforeDays allows the provider to proactively rotate the token before
                      it expires.
                      When set, the provider rotates the token when fewer than RenewBeforeDays
                      remain before expiry. Only valid with RenewalPeriodDays.
                      Must be less than RenewalPeriodDays.
                    format: int64
                    minimum: 1
                    type: integer
                  renewalPeriodDays:
                    description: |-
                      RenewalPeriodDays sets the token lifetime in days.
                      The controller creates the token with expirationDate = now + N days.
                      When the token expires the controller automatically revokes it and
                      issues a new one, refreshing the connection secret.
                      Mutually exclusive with ExpirationDate.
                    format: int64
                    minimum: 1
                    type: integer
                  type:
                    default: USER_TOKEN
                    description: |-
                      Type is the token type.
                      WARNING: This field is immutable once set.
                    enum:
                    - USER_TOKEN
                    - GLOBAL_ANALYSIS_TOKEN
                    - PROJECT_ANALYSIS_TOKEN
                    type: string
                    x-kubernetes-validations:
                    - message: Type is immutable.
                      rule: self == oldSelf
                required:
                - name
                - type
                type: object
                x-kubernetes-validations:
                - message: expirationDate and renewalPeriodDays are mutually exclusive
                  rule: '!has(self.expirationDate) || !has(self.renewalPeriodDays)'
                - message: projectKey is only valid when type is PROJECT_ANALYSIS_TOKEN
                  rule: '!has(self.projectKey) || self.type == ''PROJECT_ANALYSIS_TOKEN'''
                - message: projectKey is required when type is PROJECT_ANALYSIS_TOKEN
                  rule: self.type != 'PROJECT_ANALYSIS_TOKEN' || has(self.projectKey)
                - message: renewBeforeDays is only valid when renewalPeriodDays is
                    set
                  rule: '!has(self.renewBeforeDays) || has(self.renewalPeriodDays)'
                - message: renewBeforeDays must be less than renewalPeriodDays
                  rule: '!has(self.renewBeforeDays) || self.renewBeforeDays < self.renewalPeriodDays'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: writeConnectionSecretToRef with a non-empty name is required
              rule: has(self.writeConnectionSecretToRef) && size(self.writeConnectionSecretToRef.name)
                > 0
          status:
            description: A UserTokenStatus represents the observed state of a UserToken.
            properties:
              atProvider:
                description: UserTokenObservation are the observable fields of a UserToken.
                properties:
                  createdAt:
                    description: CreatedAt is when the token was generated.
                    format: date-time
                    type: string
                  expirationDate:
                    description: ExpirationDate is the token expiration date, if set.
                    format: date-time
                    type: string
                  isExpired:
                    description: IsExpired is true when the token has passed its expiration
                      date.
                    type: boolean
                  name:
                    description: Name is the name of the token.
                    type: string
                  renewAt:
                    description: |-
                      RenewAt is the computed time at which the provider will renew the token.
                      Only populated for renewal-managed tokens.
                    format: date-time
                    type: string
                  type:
                    description: Type is the type of the token (USER_TOKEN, GLOBAL_ANALYSIS_TOKEN,
                      PROJECT_ANALYSIS_TOKEN).
                    type: string
                required:
                - isExpired
                - name
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
