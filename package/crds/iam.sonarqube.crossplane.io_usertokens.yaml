metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: usertokens.iam.sonarqube.crossplane.io
spec:
  group: iam.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: UserToken
    listKind: UserTokenList
    plural: usertokens
    singular: usertoken
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .status.atProvider.type
      name: TYPE
      type: string
    - jsonPath: .status.atProvider.expirationDate
      name: EXPIRATION
      type: string
    - jsonPath: .status.atProvider.renewAt
      name: RENEW-AT
      type: string
    - jsonPath: .metadata.creationTimestamp
