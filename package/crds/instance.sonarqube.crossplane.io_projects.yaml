                          type: boolean
                        id:
                          description: BranchID is the unique identifier of the branch.
                          type: string
                        isMain:
                          description: IsMain indicates whether this is the main branch.
                          type: boolean
                        name:
                          description: Name is the name of the branch.
                          type: string
                        newCodePeriod:
                          description: NewCodePeriod is the new code definition of
