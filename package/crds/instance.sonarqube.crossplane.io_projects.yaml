                          properties:
                            effectiveValue:
                              description: EffectiveValue is the effective value of
                                the new code period.
                              type: string
                            inherited:
                              description: Inherited indicates whether the value is
                                inherited from a parent.
                              type: boolean
                            type:
                              description: Type is the type of the new code period.
                              type: string
                            value:
                              description: Value is the value of the new code period.
