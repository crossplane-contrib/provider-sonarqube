---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: instanceconfigurations.instance.sonarqube.crossplane.io
spec:
  group: instance.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: InstanceConfiguration
    listKind: InstanceConfigurationList
    plural: instanceconfigurations
    singular: instanceconfiguration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An InstanceConfiguration manages instance-wide options of a SonarQube
          instance that are set through dedicated endpoints rather than api/settings.
          Only the options set in spec.forProvider are reconciled.
          WARNING: only one InstanceConfiguration resource should target a given
          SonarQube instance, as multiple resources would conflict with each other.
          Deleting this resource leaves the options at their current value in
          SonarQube.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              An InstanceConfigurationSpec defines the desired state of an
              InstanceConfiguration.
            properties:
              forProvider:
                description: |-
                  InstanceConfigurationParameters are the configurable fields of an
                  InstanceConfiguration.

                  Every field is optional and maps to one instance-wide option that SonarQube
                  sets through a dedicated endpoint rather than api/settings. Only the fields
                  that are set are observed and reconciled: the options left out keep the
                  value they have in SonarQube, so Community Edition users can simply omit the
                  Enterprise Edition fields.
                properties:
                  cleanCodePolicyMode:
                    description: |-
                      CleanCodePolicyMode is the mode of the instance: MQR (Multi-Quality
                      Rules) or STANDARD_EXPERIENCE. Changing it makes SonarQube re-index
                      issues and rules.
                    enum:
                    - MQR
                    - STANDARD_EXPERIENCE
                    type: string
                  computeEngineWorkerCount:
                    description: |-
                      ComputeEngineWorkerCount is the number of Compute Engine workers that
                      process analysis reports in parallel.
                      Requires SonarQube Enterprise Edition or above. SonarQube marks this
                      endpoint as internal.
                    format: int64
                    maximum: 10
                    minimum: 1
                    type: integer
                  defaultProjectVisibility:
                    description: |-
                      DefaultProjectVisibility is the visibility given to new projects that
                      are created without an explicit one. It does not change the visibility
                      of existing projects.
                    enum:
                    - public
                    - private
                    type: string
                  scaEnabled:
                    description: |-
                      SCAEnabled enables or disables Software Composition Analysis (SonarQube
                      Advanced Security).
                      Requires SonarQube Enterprise Edition or above with a license that
                      includes SCA. SonarQube marks this endpoint as internal.
                    type: boolean
                  scimEnabled:
                    description: |-
                      SCIMEnabled enables or disables SCIM user and group provisioning.
                      Enabling it makes users and groups read-only in SonarQube; disabling it
                      removes all provisioning data, turning provisioned users and groups
                      into local ones.
                      Requires SonarQube Enterprise Edition or above. SonarQube marks this
                      endpoint as internal.
                    type: boolean
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: |-
              An InstanceConfigurationStatus represents the observed state of an
              InstanceConfiguration.
            properties:
              atProvider:
                description: |-
                  InstanceConfigurationObservation are the observable fields of an
                  InstanceConfiguration. Only the options set in the spec are observed, the
                  others are left empty.
                properties:
                  cleanCodePolicyMode:
                    description: CleanCodePolicyMode is the observed mode of the instance.
                    type: string
                  computeEngineWorkerCount:
                    description: |-
                      ComputeEngineWorkerCount is the observed number of Compute Engine
                      workers.
                    format: int64
                    type: integer
                  defaultProjectVisibility:
                    description: |-
                      DefaultProjectVisibility is the observed default visibility of new
                      projects.
                    type: string
                  scaEnabled:
                    description: |-
                      SCAEnabled is whether Software Composition Analysis is observed as
                      enabled.
                    type: boolean
                  scimEnabled:
                    description: SCIMEnabled is whether SCIM provisioning is observed
                      as enabled.
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
