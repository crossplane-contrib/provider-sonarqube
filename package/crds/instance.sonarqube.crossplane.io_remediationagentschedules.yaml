---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: remediationagentschedules.instance.sonarqube.crossplane.io
spec:
  group: instance.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: RemediationAgentSchedule
    listKind: RemediationAgentScheduleList
    plural: remediationagentschedules
    singular: remediationagentschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A RemediationAgentSchedule manages when the SonarQube Remediation Agent
          fixes the issue backlog, either instance-wide or for a single project.
          Enterprise Edition only.

          Deleting the instance-wide schedule disables it, as SonarQube cannot delete
          it. Deleting a project schedule makes the project follow the instance-wide
          one again.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              A RemediationAgentScheduleSpec defines the desired state of a
              RemediationAgentSchedule.
            properties:
              forProvider:
                description: |-
                  RemediationAgentScheduleParameters are the configurable fields of a
                  RemediationAgentSchedule.

                  Without projectKey, projectKeyRef or projectKeySelector the resource manages
                  the instance-wide schedule. With one of them it manages the schedule of that
                  project, which overrides the instance-wide one. SonarQube holds at most one
                  schedule per scope.
                properties:
                  dayOfWeek:
                    description: |-
                      DayOfWeek is the day the agent runs on. Required when Frequency is
                      WEEKLY, and forbidden when it is DAILY.
                    enum:
                    - MONDAY
                    - TUESDAY
                    - WEDNESDAY
                    - THURSDAY
                    - FRIDAY
                    - SATURDAY
                    - SUNDAY
                    type: string
                  enabled:
                    description: Enabled turns scheduled remediation on or off.
                    type: boolean
                  frequency:
                    description: Frequency is how often the agent runs.
                    enum:
                    - DAILY
                    - WEEKLY
                    type: string
                  hour:
                    description: Hour is the hour of the day, in Timezone, at which
                      the agent runs.
                    format: int32
                    maximum: 23
                    minimum: 0
                    type: integer
                  maxIssuesPerRun:
                    description: |-
                      MaxIssuesPerRun is the maximum number of issues a run fixes.
                      Late-initialized from SonarQube, and 5 when a project schedule is created
                      without it.
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                  maxOpenPRs:
                    description: |-
                      MaxOpenPRs pauses scheduled runs while this many pull requests opened by
                      them are still open. -1 never pauses. Late-initialized from SonarQube,
                      and 3 when a project schedule is created without it.
                    format: int32
                    type: integer
                    x-kubernetes-validations:
                    - message: maxOpenPRs must be between 1 and 100, or -1 for unlimited
                      rule: self == -1 || (self >= 1 && self <= 100)
                  projectKey:
                    description: |-
                      ProjectKey is the key of the project whose schedule is managed. Leave it,
                      ProjectKeyRef and ProjectKeySelector unset to manage the instance-wide
                      schedule.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: omit projectKey to manage the instance-wide schedule
                      rule: self != '*'
                    - message: projectKey is immutable
                      rule: self == oldSelf
                  projectKeyRef:
                    description: ProjectKeyRef references a Project to retrieve its
                      key.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  projectKeySelector:
                    description: ProjectKeySelector selects a Project to retrieve
                      its key.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  projectSelectionMode:
                    description: |-
                      ProjectSelectionMode selects the projects the instance-wide schedule
                      applies to. Only valid on the instance-wide schedule, and
                      late-initialized from SonarQube.
                    enum:
                    - ALL
                    - SELECTED
                    type: string
                  selectedProjectKeyRefs:
                    description: SelectedProjectKeyRefs references Projects to retrieve
                      their keys.
                    items:
                      description: A Reference to a named object.
                      properties:
                        name:
                          description: Name of the referenced object.
                          type: string
                        policy:
                          description: Policies for referencing.
                          properties:
                            resolution:
                              default: Required
                              description: |-
                                Resolution specifies whether resolution of this reference is required.
                                The default is 'Required', which means the reconcile will fail if the
                                reference cannot be resolved. 'Optional' means this reference will be
                                a no-op if it cannot be resolved.
                              enum:
                              - Required
                              - Optional
                              type: string
                            resolve:
                              description: |-
                                Resolve specifies when this reference should be resolved. The default
                                is 'IfNotPresent', which will attempt to resolve the reference only when
                                the corresponding field is not present. Use 'Always' to resolve the
                                reference on every reconcile.
                              enum:
                              - Always
                              - IfNotPresent
                              type: string
                          type: object
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                  selectedProjectKeySelector:
                    description: SelectedProjectKeySelector selects Projects to retrieve
                      their keys.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  selectedProjectKeys:
                    description: |-
                      SelectedProjectKeys are the keys of the projects the instance-wide
                      schedule applies to when ProjectSelectionMode is SELECTED. This list is
                      exhaustive: any other project is removed from the selection.
                    items:
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  timezone:
                    description: |-
                      Timezone is the IANA time zone of the schedule, such as Europe/Paris.
                      Late-initialized from SonarQube, and UTC when a project schedule is
                      created without it.
                    minLength: 1
                    type: string
                required:
                - enabled
                - frequency
                - hour
                type: object
                x-kubernetes-validations:
                - message: dayOfWeek is required when frequency is WEEKLY
                  rule: self.frequency != 'WEEKLY' || has(self.dayOfWeek)
                - message: dayOfWeek must not be set when frequency is DAILY
                  rule: self.frequency != 'DAILY' || !has(self.dayOfWeek)
                - message: projectSelectionMode and selected projects are only valid
                    on the instance-wide schedule
                  rule: '!(has(self.projectKey) || has(self.projectKeyRef) || has(self.projectKeySelector))
                    || !(has(self.projectSelectionMode) || has(self.selectedProjectKeys)
                    || has(self.selectedProjectKeyRefs) || has(self.selectedProjectKeySelector))'
                - message: selected projects must be set if, and only if, projectSelectionMode
                    is SELECTED
                  rule: (has(self.projectSelectionMode) && self.projectSelectionMode
                    == 'SELECTED') == (has(self.selectedProjectKeys) || has(self.selectedProjectKeyRefs)
                    || has(self.selectedProjectKeySelector))
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: a schedule cannot change between instance-wide and project
                scope
              rule: (has(self.forProvider.projectKey) || has(self.forProvider.projectKeyRef)
                || has(self.forProvider.projectKeySelector)) == (has(oldSelf.forProvider.projectKey)
                || has(oldSelf.forProvider.projectKeyRef) || has(oldSelf.forProvider.projectKeySelector))
          status:
            description: |-
              A RemediationAgentScheduleStatus represents the observed state of a
              RemediationAgentSchedule.
            properties:
              atProvider:
                description: |-
                  RemediationAgentScheduleObservation are the observable fields of a
                  RemediationAgentSchedule.
                properties:
                  dayOfWeek:
                    description: DayOfWeek is the day a weekly schedule runs on.
                    type: string
                  enabled:
                    description: Enabled reports whether scheduled remediation is
                      on.
                    type: boolean
                  frequency:
                    description: Frequency is how often the agent runs.
                    type: string
                  hour:
                    description: Hour is the hour of the day at which the agent runs.
                    format: int32
                    type: integer
                  id:
                    description: |-
                      ID is the identifier of the schedule: the project key, or "*" for the
                      instance-wide schedule.
                    type: string
                  maxIssuesPerRun:
                    description: MaxIssuesPerRun is the maximum number of issues a
                      run fixes.
                    format: int32
                    type: integer
                  maxOpenPRs:
                    description: MaxOpenPRs is the open pull request limit, -1 when
                      unlimited.
                    format: int32
                    type: integer
                  nextRunTime:
                    description: NextRunTime is the time of the next scheduled run.
                    format: date-time
                    type: string
                  projectKey:
                    description: |-
                      ProjectKey is the key of the project, empty for the instance-wide
                      schedule.
                    type: string
                  projectSelectionMode:
                    description: |-
                      ProjectSelectionMode is the project selection of the instance-wide
                      schedule.
                    type: string
                  selectedProjectKeys:
                    description: |-
                      SelectedProjectKeys are the projects selected by the instance-wide
                      schedule.
                    items:
                      type: string
                    type: array
                  timezone:
                    description: Timezone is the time zone of the schedule.
                    type: string
                required:
                - enabled
                - hour
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
