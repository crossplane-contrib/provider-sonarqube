---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: plugins.instance.sonarqube.crossplane.io
spec:
  group: instance.sonarqube.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - sonarqube
    kind: Plugin
    listKind: PluginList
    plural: plugins
    singular: plugin
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .status.atProvider.pending
      name: PENDING
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Plugin manages a SonarQube plugin installation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of this Plugin.
            properties:
              forProvider:
                description: ForProvider holds the provider-specific configuration
                  for this Plugin.
                properties:
                  autoUpdate:
                    default: true
                    description: |-
                      AutoUpdate indicates if the plugin should be automatically updated when a new version is available.
                      Defaults to true if unset
                    type: boolean
                  key:
                    description: Key is the plugin key in the SonarQube marketplace.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: Key is immutable
                      rule: self == oldSelf
                required:
                - key
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: Status represents the observed state of this Plugin.
            properties:
              atProvider:
                description: AtProvider holds the provider-specific observed state
                  of this Plugin.
                properties:
                  description:
                    description: Description is the plugin description.
                    type: string
                  editionBundled:
                    description: EditionBundled indicates if the plugin is bundled
                      with an edition.
                    type: boolean
                  filename:
                    description: Filename is the plugin filename.
                    type: string
                  hash:
                    description: Hash is the file hash.
                    type: string
                  homepageUrl:
                    description: HomepageURL is the plugin homepage URL.
                    type: string
                  implementationBuild:
                    description: ImplementationBuild is the implementation build.
                    type: string
                  isLatest:
                    description: |-
                      IsLatest indicates if the installed plugin is the latest
                      version available in the marketplace.
                    type: boolean
                  issueTrackerUrl:
                    description: IssueTrackerURL is the issue tracker URL.
                    type: string
                  key:
                    description: Key is the plugin key.
                    type: string
                  license:
                    description: License is the plugin license.
                    type: string
                  name:
                    description: Name is the plugin name.
                    type: string
                  organizationName:
                    description: OrganizationName is the organization name.
                    type: string
                  organizationUrl:
                    description: OrganizationURL is the organization URL.
                    type: string
                  pending:
                    description: |-
                      Pending is true when the plugin installation has been queued
                      but SonarQube has not yet restarted to apply it.
                    type: boolean
                  requiredForLanguages:
                    description: RequiredForLanguages is the list of languages requiring
                      this plugin.
                    items:
                      type: string
                    type: array
                  sonarLintSupported:
                    description: SonarLintSupported indicates if SonarLint is supported.
                    type: boolean
                  updatedAt:
                    description: UpdatedAt is the timestamp when the plugin was updated.
                    format: date-time
                    type: string
                  version:
                    description: Version is the plugin version.
                    type: string
                required:
                - editionBundled
                - isLatest
                - pending
                - sonarLintSupported
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
