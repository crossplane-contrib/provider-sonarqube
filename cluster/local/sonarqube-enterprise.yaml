apiVersion: v1
kind: Service
metadata:
  name: sonarqube-enterprise
  namespace: default
  labels:
    app: sonarqube-enterprise
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: sonarqube-enterprise
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube-enterprise
  namespace: default
  labels:
    app: sonarqube-enterprise
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube-enterprise
  template:
    metadata:
      labels:
        app: sonarqube-enterprise
    spec:
      containers:
        - name: sonarqube
          # renovate: datasource=docker depName=sonarqube versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:\.(?<build>\d+))?-enterprise$
          image: docker.io/library/sonarqube:2026.5.5-enterprise@sha256:9b590f4830437849cce23bad32091fbb160a05ff3a86360d011d656ed5576c4b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
              protocol: TCP
          env:
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "5Gi"
          startupProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
