version: "2"
linters:
  default: all
  disable:
    - depguard
    - err113
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - interfacebloat
    - ireturn
    - lll
    - nonamedreturns
    - revive
    - testpackage
    - wrapcheck
    - wsl
  settings:
    copyloopvar:
      check-alias: true
    dupl:
      threshold: 100
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt:.*,io/ioutil:^Read.*
    goconst:
      min-occurrences: 2
      match-constant: false
      find-duplicates: true
      eval-const-expressions: true
    gocritic:
      enable-all: true
      # enabled-tags:
      #   - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 10
    godoclint:
      default: all
    goheader:
      template: |-
        Copyright 2026 The Crossplane Authors.

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    iface:
      # List of analyzers.
      # Default: ["identical"]
      enable:
        - identical
        - unused
        - unexported
    lll:
      tab-width: 1
    modernize:
      disable:
        - omitzero
    nakedret:
      max-func-lines: 30
    nilnil:
      detect-opposite: true
    nolintlint:
      require-explanation: true
      require-specific: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    promlinter:
      strict: true
    reassign:
      patterns:
        - ".*"
    unconvert:
      fast-math: true
    unparam:
      check-exported: false
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-date-month: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
          - cyclop
          - dupl
          - errcheck
          - exportloopref
          - funlen
          - gocyclo
          - gosec
          - unparam
          - varnamelen
        path: _test(ing)?\.go
      - linters:
          - gocritic
        path: _test\.go
        text: (unnamedResult|exitAfterDefer)
      - linters:
          - gocritic
        text: "(hugeParam|rangeValCopy):"
      - linters:
          - staticcheck
        text: "SA3000:"
      - linters:
          - staticcheck
        text: "SA1019: mgr.GetEventRecorderFor is deprecated:"
      - linters:
          - gosec
        text: "G101:"
      - linters:
          - gosec
        text: "G104:"
    paths:
      - zz_generated\..+\.go$
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/crossplane/provider-sonarqube
  exclusions:
    generated: lax
    paths:
      - zz_generated\..+\.go$
      - third_party$
      - builtin$
      - examples$
